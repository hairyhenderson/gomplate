<script src="{{ "js/release-check.js" | relURL }}"></script>
<script>
(function () {
  var webSdkScript = document.createElement("script");
  webSdkScript.src = "https://unpkg.com/@grafana/faro-web-sdk@^2.13.0/dist/bundle/faro-web-sdk.iife.js";

  webSdkScript.onload = () => {
    window.GrafanaFaroWebSdk.initializeFaro({
      url: "https://faro-collector-prod-us-central-0.grafana.net/collect/d8b5652f5dd57fb1cfec9a1c32970fe0",
      app: {
        name: "docs.gomplate.ca",
        version: "1.0.0",
        environment: "production",
      },
    });

    // Load instrumentations at the onLoad event of the web-SDK and after the above configuration.
    // This is important because we need to ensure that the Web-SDK has been loaded and initialized before we add further instruments!
    var webTracingScript = document.createElement("script");

    webTracingScript.src = "https://unpkg.com/@grafana/faro-web-tracing@^2.13.0/dist/bundle/faro-web-tracing.iife.js";

    // Initialize, configure (if necessary) and add the the new instrumentation to the already loaded and configured Web-SDK.
    webTracingScript.onload = () => {
      window.GrafanaFaroWebSdk.faro.instrumentations.add(
        new window.GrafanaFaroWebTracing.TracingInstrumentation()
      );
    };

    // Append the Web Tracing script script tag to the HTML page
    document.head.appendChild(webTracingScript);

    var replayScript = document.createElement("script");
    replayScript.src = "https://unpkg.com/@grafana/faro-instrumentation-replay@^2.13.0/dist/bundle/faro-instrumentation-replay.iife.js";
    replayScript.onload = () => {
      window.GrafanaFaroWebSdk.faro.instrumentations.add(
        new window.GrafanaFaroInstrumentationReplay.ReplayInstrumentation({
          // docs text is public; inputs stay masked
          maskTextSelector: null,
        })
      );
    };
    document.head.appendChild(replayScript);
  };

  // Append the Web-SDK script script tag to the HTML page
  document.head.appendChild(webSdkScript);
})();
</script>
