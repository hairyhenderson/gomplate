name: release-please

on:
  push:
    branches:
      - main
  # dry-run the artifact build on PRs that change this workflow, since it
  # otherwise only runs when a release is created
  pull_request:
    paths:
      - .github/workflows/release-please.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      html_url: ${{ steps.release.outputs.html_url }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
      # I can't use the action because it doesn't support the --draft flag,
      # and it doesn't support uploading assets.
      #
      # - uses: googleapis/release-please-action@v4
      #   with:
      #     token: ${{ steps.app-token.outputs.token }}
      #     config-file: release-please-config.json
      - name: Install release-please
        run: npm -g install release-please
      - name: release-please github-release
        id: release
        run: |
          release-please \
            --token ${{ steps.app-token.outputs.token }} \
            --repo-url ${{ github.repository }} \
              github-release \
              --draft | tee rp-out.log

          # parse the js object and store it
          cat rp-out.log | sed -n '/^\[/,$p' > rp-out.js

          # if it's just "[]" assume no-op
          if [ "$(cat rp-out.js)" = "[]" ]; then
            exit 0
          fi

          # extract only the fields we need via regex - avoids eval() which
          # fails when release notes contain JS spread syntax or other constructs
          # that node can't eval. Only tag_name and version are used downstream.
          node << 'NODEOF' >> "$GITHUB_OUTPUT"
          const c = require('fs').readFileSync('rp-out.js', 'utf8');
          const tagMatch = c.match(/tagName:\s*'([^']+)'/);
          const verMatch = c.match(/\bversion:\s*'(\d[^']+)'/);
          if (!tagMatch) { process.stderr.write('tagName not found in release-please output\n'); process.exit(1); }
          if (!verMatch) { process.stderr.write('version not found in release-please output\n'); process.exit(1); }
          process.stdout.write('tag_name=' + tagMatch[1] + '\n');
          process.stdout.write('version=' + verMatch[1] + '\n');
          NODEOF

          echo "release_created=true" >> "$GITHUB_OUTPUT"
      - name: release-please release-pr
        id: release-pr
        if: ${{ ! steps.release.outputs.release_created }}
        run: |
          release-please \
            --token ${{ steps.app-token.outputs.token }} \
            --repo-url ${{ github.repository }} \
              release-pr | tee rp-out.log

          # parse the js object and store it - this is brittle!
          cat rp-out.log | sed -n '/^\[/,$p' > rp-out.js

          # if it's just "[]" assume no-op
          if [ "$(cat rp-out.js)" = "[]" ]; then
            exit 0
          fi

          # set outputs
          # (pr/prs outputs are not referenced by any downstream job)
          echo "prs_created=true" >> "$GITHUB_OUTPUT"
  build-artifacts:
    runs-on: ubuntu-latest
    needs: release-please
    # release-please is skipped on PRs, so !cancelled() is needed to run at all
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created || github.event_name == 'pull_request') }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      version: ${{ needs.release-please.outputs.version }}
    env:
      VERSION: ${{ needs.release-please.outputs.version || '0.0.0-dryrun' }}
      BINARY: gomplate_${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.variant }}${{ matrix.extension }}
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        include:
          - goos: freebsd
            goarch: amd64
          - goos: linux
            goarch: '386'
          - goos: linux
            goarch: arm
            variant: 'v6'
          - goos: linux
            goarch: arm
            variant: 'v7'
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: s390x
          - goos: solaris
            goarch: amd64
          - goos: windows
            goarch: amd64
            extension: .exe
          - goos: windows
            goarch: '386'
            extension: .exe
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        if: github.event_name == 'push'
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build Artifacts for ${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.variant }}
        run: |
          export COMMIT=${{ github.sha }}

          make bin/gomplate_${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.variant }}${{ matrix.extension }}_checksum_sha256.txt \
            VERSION=$VERSION
          make bin/gomplate_${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.variant }}${{ matrix.extension }}_checksum_sha512.txt \
            VERSION=$VERSION

          if [ "${{ matrix.goos }}-${{ matrix.goarch }}" = "windows-amd64" ]; then
            make bin/gomplate_windows-amd64.zip VERSION=$VERSION
          fi
      # the SBOM is generated from the module info embedded in the binary, so
      # it describes exactly what was built
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: bin/${{ env.BINARY }}
          format: spdx-json
          output-file: bin/${{ env.BINARY }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Check SBOM
        run: |
          jq -e '.packages | any(.name == "stdlib")' bin/${{ env.BINARY }}.spdx.json
      # don't attest or keep dry-run builds
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bin/${{ env.BINARY }}
      - name: Attest SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bin/${{ env.BINARY }}
          sbom-path: bin/${{ env.BINARY }}.spdx.json
      - name: Save Artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.variant }}
          path: bin/*
          retention-days: 1
  create-release:
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: github.event_name == 'push'
    env:
      VERSION: ${{ needs.build-artifacts.outputs.version }}
      TAG_NAME: ${{ needs.build-artifacts.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      - name: Organize Artifacts
        run: |
          mv build*/* .
          rm -rf build*
      - name: Aggregate Checksums
        run: |
          # duplicate the make bin/checksums_sha(256|512).txt targets without
          # invoking make
          cat gomplate_*_checksum_sha256.txt > checksums-${TAG_NAME}_sha256.txt
          cat gomplate_*_checksum_sha512.txt > checksums-${TAG_NAME}_sha512.txt

          # clean up a bit to make the upload simpler
          rm *_checksum*.txt
      - name: Upload Release Assets
        run: |
          ls -alh

          assets="checksums-${TAG_NAME}_sha256.txt checksums-${TAG_NAME}_sha512.txt"
          for f in gomplate_*; do
            assets="$assets ${f}"
          done

          echo "uploading assets: $assets"
          gh release upload ${TAG_NAME} $assets \
            --clobber --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Publish Release
        run: |
          gh release edit ${TAG_NAME} \
            --discussion-category "General" \
            --repo ${{ github.repository }} \
            --draft=false
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Upload archive checksums
        id: archive-checksums
        # has to happen post-publish so the URL works
        run: |
          archive=https://github.com/${{ github.repository }}/archive/refs/tags/${TAG_NAME}.tar.gz
          archiveFile=archive.tar.gz
          curl -f -sSL -o $archiveFile $archive

          sha256sum $archiveFile | cut -f1 -d\  > ${TAG_NAME}.sha256
          sha512sum $archiveFile | cut -f1 -d\  > ${TAG_NAME}.sha512

          echo "sha256sum=$(cat ${TAG_NAME}.sha256)" >> $GITHUB_OUTPUT
          echo "sha512sum=$(cat ${TAG_NAME}.sha512)" >> $GITHUB_OUTPUT

          gh release upload ${TAG_NAME} ${TAG_NAME}.sha256 ${TAG_NAME}.sha512 \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
