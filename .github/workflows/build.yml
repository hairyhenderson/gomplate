name: Build
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/hairyhenderson/gomplate-ci-build@sha256:9b9dae304b1f7d3cec66d411f2b8c85ca92ef2b1af15a4ba1b6bc8b87556224e
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: '386'
            runner: ubuntu-latest
          - goarch: 'amd64'
            runner: ubuntu-latest
          - goarch: 'arm'
            goarm: '7'
            runner: ubuntu-24.04-arm
          - goarch: 'arm64'
            runner: ubuntu-24.04-arm
    steps:
      - run: |
          git config --global user.email "bogus@example.com"
          git config --global user.name "Someone"
          git config --global --add safe.directory /__w/gomplate/gomplate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # PRs only restore the Go caches; only main saves them. A PR-scoped cache
      # can't be used by any other PR, and Renovate PRs (each with a different
      # go.sum) were filling the repo's cache quota and evicting main's caches.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: go-cache
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.goarch }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.goarch }}-go-
      - run: make build GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }}
      - run: make test GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }}
      - name: Check schema is up to date
        if: matrix.goarch == 'amd64'
        run: make -B schema/gomplate-config.json && git diff --exit-code schema/
      - run: make integration GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.goarch }}-go-${{ hashFiles('**/go.sum') }}
  windows-build:
    runs-on: windows-latest
    env:
      # note: the tmp dir is set to C: so that it's not on the same drive as the
      # repo, which is on D: - this will expose bugs with path handling!
      TMP: C:\tmp
    steps:
      - run: pwd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: |
          git config --global user.email "bogus@example.com"
          git config --global user.name "Someone"
      - run: make build
      - run: make test
      - run: make integration
