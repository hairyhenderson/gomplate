name: Deploy Released Assets

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
    steps:
      - id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version=${TAG_NAME#v}
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "major=v${version%%.*}" >> $GITHUB_OUTPUT

  update-release-check:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      # use an app token (not GITHUB_TOKEN) so the opened PR triggers the
      # required status checks - PRs opened with GITHUB_TOKEN don't
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: bump LATEST_RELEASE in docs/static/js/release-check.js
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -ex

          sed -i "s/const LATEST_RELEASE = '.*';/const LATEST_RELEASE = '${TAG_NAME}';/" docs/static/js/release-check.js

          if git diff --quiet docs/static/js/release-check.js; then
            echo "already up to date, nothing to do"
            exit 0
          fi

          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          # chore (hidden in release-please-config.json), not docs: a visible
          # type would make release-please open a new release PR after every
          # release, which would in turn trigger this job again
          branch="docs/release-check-${TAG_NAME}"
          git checkout -b "${branch}"
          git add docs/static/js/release-check.js
          git commit -sm "chore(release-check): bump latest known release to ${TAG_NAME}"
          git push -u origin "${branch}"

          gh pr create --title "chore(release-check): bump latest known release to ${TAG_NAME}" \
            --body "Automated update after releasing ${TAG_NAME}." \
            --base main --head "${branch}"

          # merges itself once the required status checks pass - no human action needed
          gh pr merge --auto --squash "${branch}"

  docker-latest:
    needs: version
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7,linux/ppc64le,linux/s390x,windows/amd64
      target: gomplate
      cache: true
      build-args: |
        VCS_REF=${{ github.sha }}
        VERSION=${{ needs.version.outputs.version }}
      meta-images: |
        ghcr.io/hairyhenderson/gomplate
        gomplate/gomplate
        hairyhenderson/gomplate
      meta-tags: |
        type=raw,value=latest
        type=raw,value=stable
        type=raw,value=${{ github.event.release.tag_name }}
        type=raw,value=${{ needs.version.outputs.major }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  docker-alpine:
    needs: version
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7,linux/ppc64le,linux/s390x
      target: gomplate-alpine
      cache: true
      build-args: |
        VCS_REF=${{ github.sha }}
        VERSION=${{ needs.version.outputs.version }}
      meta-images: |
        ghcr.io/hairyhenderson/gomplate
        gomplate/gomplate
        hairyhenderson/gomplate
      meta-tags: |
        type=raw,value=alpine
        type=raw,value=stable-alpine
        type=raw,value=${{ github.event.release.tag_name }}-alpine
        type=raw,value=${{ needs.version.outputs.major }}-alpine
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
